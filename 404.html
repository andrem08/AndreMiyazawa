        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;

        }
        h1 {
            margin: 0;

            font-weight: 800;
            line-height: 1;
            background: linear-gradient(90deg, #22d3ee, #3b82f6, #8a2be2);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        code {
            font-family: "JetBrains Mono", monospace;
            color: #3b82f6;
        }
        a {
            display: inline-block;
            margin-top: 28px;
            padding: 13px 24px;
            border-radius: 12px;
            background: linear-gradient(90deg, #3b82f6, #8a2be2);
            color: #fff;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
        }
    </style>
